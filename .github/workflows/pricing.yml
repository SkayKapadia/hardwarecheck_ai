name: Daily cloud pricing refresh

on:
  schedule:
    - cron: "47 5 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch latest cloud pricing
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          LAMBDA_API_KEY: ${{ secrets.LAMBDA_API_KEY }}
        run: node scripts/fetch_pricing.mjs

      # main is a protected branch (PRs required), so the bot cannot push
      # directly — open (or update) a pull request with the new prices instead.
      - name: Open pull request if cloud.json changed
        uses: peter-evans/create-pull-request@v7
        with:
          branch: chore/daily-pricing
          delete-branch: true
          title: "chore: daily cloud pricing refresh"
          commit-message: "chore: daily cloud pricing refresh"
          body: |
            Automated daily refresh of `src/data/cloud.json` from provider APIs
            (Vast.ai live; RunPod/Lambda when API keys are configured).

            Liquidity badges are derived from real offer counts. Review the diff
            and merge — Vercel deploys automatically on merge.
          labels: pricing, automated
